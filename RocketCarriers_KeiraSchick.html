    <script>
      const elements = document.querySelectorAll(
        ".reveal, .project-meta-reveal",
      );

      const observer = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            }
          });
        },
        {
          threshold: 0.45,
        },
      );

      elements.forEach((el) => observer.observe(el));

      const projectHeader = document.querySelector(
        ".hero-header-work .nav-branding",
      );
      let lastScrollY = window.scrollY;

      const syncProjectHeader = () => {
        if (!projectHeader) return;

        const currentScrollY = window.scrollY;
        const scrollingDown = currentScrollY > lastScrollY;
        const nearTop = currentScrollY <= 8;

        projectHeader.classList.toggle("is-hidden", scrollingDown && !nearTop);
        lastScrollY = currentScrollY;
      };

      syncProjectHeader();
      window.addEventListener("scroll", syncProjectHeader, { passive: true });
    </script>
