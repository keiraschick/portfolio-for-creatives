<!doctype html>
<html lang="en">
  <head>
    <title>Keira Schick | Graphic Designer</title>
    <meta
      name="description"
      content="Vancouver-based Graphic Designer, Keira Schick specializes in Branding and Illustration, crafting human experiences & imaginative stories into visual real-world design. Open to freelance work, let's connect!"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:image" content="screenshot.jpg" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/favicons/KeiraSchick_favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      href="assets/favicons/KeiraSchick_favicon.png"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body class="home-page" id="top">
    <header class="hero-header hero-header-top">
      <ul class="hero-nav-branding hero-nav-branding-top">
        <li class="nav-branding-item">
          <a href="work.html" class="hero-nav-link-primary all-caps">work</a>
        </li>
        <li class="nav-branding-item">
          <a href="about.html" class="hero-nav-link-primary all-caps">about</a>
        </li>
      </ul>
    </header>

    <ul class="hero-headline-wrapper" id="wordmarkArea">
      <li class="wordmark reveal">
        <object
          type="image/svg+xml"
          data="assets/branding-images/logorestframe.svg"
          onload="console.log('SVG loaded')"
        ></object>
      </li>
      <li class="clear-box" id="wordmarkAnimation"></li>
    </ul>
    <div class="blurb-container">
      <p class="blurb all-caps reveal">
        <span style="background-color: #bedd4e">
          graphic designer located in vancouver, bc. currently working at
          Resonance.
        </span>
      </p>
    </div>

    <header class="hero-header hero-header-bottom">
      <ul class="hero-nav-branding hero-nav-branding-bottom">
        <li class="nav-branding-item">
          <a href="work.html" class="hero-nav-link-primary all-caps">shop</a>
        </li>
        <li class="nav-branding-item">
          <a href="about.html" class="hero-nav-link-primary all-caps"
            >contact</a
          >
        </li>
      </ul>
    </header>

    <canvas id="bouncingCanvas"></canvas>
    <script src="js/flames.js"></script>
    <script>
      const elements = document.querySelectorAll(".reveal");

      const observer = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target); // 👈 KEY LINE
            }
          });
        },
        {
          threshold: 0.2,
        },
      );

      elements.forEach((el) => observer.observe(el));
    </script>
  </body>
</html>
